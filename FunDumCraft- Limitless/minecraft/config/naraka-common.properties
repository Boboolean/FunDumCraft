# Restart required
# default : false
show_test_creative_mode_tab=false

# default : 1200
stigma_consume_tick=1200

# default : 2.0
herobrine_hurt_limit_reduce=2.0

# default : 3
max_shadow_herobrine_spawn=3

# default : 5.0
faster_liquid_swimming_speed=5.0

# default : false
