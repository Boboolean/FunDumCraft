# default : 2
naraka_fireball_direction_update_interval=2

# Update every 2 sec
# default : 15.0
herobrine_phase_3_dps_limit=15.0

# Need to restart game
# default : 66.0
naraka_pickaxe_damage=66.0

# default : false
break_combo_when_skill_disabled=false

# default : false
always_combo=false

# Stigma stun duration in ticks
# default : 0
stigma_stun_duration=0

# default : true
enable_stigma=true

# default : 0.1
lock_health_ratio=0.1

# default : 10
