# default : 0.5
naraka_dimension_in_liquid_speed_multiplier=0.5

# Adds the sanctuary compass to chests of a cartographer villager in the overworld
# default : true
add_to_loot=true

# Adds the sanctuary compass to trades of a wandering trader in the overworld
# default : true
add_to_trades=true

# Require that the player has a special item in their inventory to activate the totem.
# default : false
require_special_item=false

# The id of the special item required to activate the totem.
# default : 
special_item_id=

# The text to display when the player does not have the required item.
# default : You are missing the required item!
special_item_missing_message=You are missing the required item!

